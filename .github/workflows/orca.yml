name: orca

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [orca.py, .github/workflows/orca.yml]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python test_orca.py
      - run: python orca.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORCA_LOGIN: ${{ github.repository_owner }}
      - name: Commit the orca if it changed
        run: |
          git add orca/orca.gif
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: redraw the orca"
          git push
