name: cards

on:
  schedule:
    - cron: "30 0 * * *" # after the orca and the bonsai, so the pushes do not race
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/cards.yml]

env:
  LIGHT: hide_border=true&disable_animations=true&bg_color=00000000&title_color=0b4f7c&text_color=1f2328&icon_color=1a7fbf&ring_color=0b4f7c&card_width=400
  DARK: hide_border=true&disable_animations=true&bg_color=00000000&title_color=6fb7e0&text_color=c9d1d9&icon_color=7ccdf2&ring_color=6fb7e0&card_width=400
  STATS: show_icons=true&rank_icon=github&count_private=true # adds private and org contributions the profile shares
  LANGS: layout=compact&langs_count=6&custom_title=Most+used+languages

jobs:
  # Third-party code runs here with a read-only token and cannot push.
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.LIGHT }}&${{ env.STATS }}
          path: cards/stats-light.svg
          core_version: 2.2.0
          fail_on_error: "true" # a failed fetch fails the run instead of writing an error card
      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&${{ env.DARK }}&${{ env.STATS }}
          path: cards/stats-dark.svg
          core_version: 2.2.0
          fail_on_error: "true"
      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.LIGHT }}&${{ env.LANGS }}
          path: cards/languages-light.svg
          core_version: 2.2.0
          fail_on_error: "true"
      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&${{ env.DARK }}&${{ env.LANGS }}
          path: cards/languages-dark.svg
          core_version: 2.2.0
          fail_on_error: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: cards
          path: cards/

  # Only our own steps get write access.
  commit:
    needs: draw
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cards
          path: cards/
      - name: Commit the cards if they changed
        run: |
          git add cards
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: draw the day's cards"
          git pull --rebase
          git push
