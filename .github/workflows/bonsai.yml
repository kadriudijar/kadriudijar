name: bonsai

on:
  schedule:
    - cron: "20 0 * * *" # 10 minutes after the orca, so the two pushes do not race
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/bonsai.yml]

jobs:
  # Third-party code runs here with a read-only token and cannot push.
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: egorthinks/git-bonsai@bec04c39f62731fdb28c3b82322ef21cbf3bdfac
        with:
          commit: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: bonsai
          path: output/

  # Only our own steps get write access.
  commit:
    needs: grow
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bonsai
          path: output/
      - name: Commit the bonsai if it changed
        run: |
          git add output
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: tend the bonsai"
          git pull --rebase
          git push
